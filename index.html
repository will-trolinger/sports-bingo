<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Bingo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --accent: #007BFF;
  --accent-dark: #0056b3;
  --bg: #f4f4f8;
  --cell-bg: #ffffff;
  --cell-marked: #a8e6a2;
  --font-family: "Segoe UI", Tahoma, sans-serif;
}

body {
  font-family: var(--font-family);
  background-color: var(--bg);
  margin: 0;
  padding: 0 12px;
  text-align: center;
}

h1 {
  margin-top: 20px;
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  color: #222;
}

.btn {
  background-color: var(--accent);
  color: white;
  padding: 12px 24px;
  margin: 4px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  cursor: pointer;
  transition: background-color 0.3s, transform 0.2s;
  box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  display: inline-block;
}

.btn:hover {
  background-color: var(--accent-dark);
  transform: scale(1.03);
}

.bingo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}

table {
  border-collapse: collapse;
  margin: 0 auto;
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
  width: 100%;
  max-width: 500px;
  table-layout: fixed;
}

td {
  border: 2px solid #333;
  background-color: var(--cell-bg);
  text-align: center;
  vertical-align: middle;
  cursor: pointer;
  font-size: clamp(0.75rem, 3vw, 1rem);
  transition: background-color 0.2s, transform 0.1s;
  user-select: none;
  position: relative;
  padding: 5px;
  -webkit-tap-highlight-color: transparent;
}

/* aspect-ratio has no effect on table cells, so the square is enforced here */
.cell {
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

td.marked {
  background-color: var(--cell-marked);
}

td[data-free="true"] {
  pointer-events: none;
  font-weight: bold;
  font-size: 1.1em;
  color: #444;
}

img {
  max-width: 80%;
  max-height: 60%;
  display: block;
  margin: 4px auto 3px;
  object-fit: contain;
  min-height: 0;
  flex: 0 1 auto;
}

@media (max-width: 600px) {
  h1 {
    font-size: 1.75rem;
  }
  .btn {
    width: 100%;
    font-size: 1rem;
    margin: 0 0 4px 0;
    padding: 14px 24px;
  }
  .bingo-container {
    gap: 12px;
  }
  td {
    font-size: 0.7rem;
    padding: 2px;
    border-width: 1px;
  }
  img {
    max-width: 90%;
    max-height: 40px;
  }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
<h1 id="title">Baseball Bingo</h1>

<div class="bingo-container">
  <div style="text-align: center;">
    <button class="btn" onclick="changeSport('baseball')">Baseball</button>
    <button class="btn" onclick="changeSport('football')">Football</button>
    <button class="btn" onclick="changeSport('college')">College</button>
  </div>

  <table id="bingo"></table>

  <button class="btn" onclick="generateNewCard()">Generate New Card</button>
</div>

<script>
const TEAMS = {
  baseball: {
    Yankees: "nyy", RedSox: "bos", BlueJays: "tor", Rays: "tb", Orioles: "bal",
    WhiteSox: "cws", Guardians: "cle", Tigers: "det", Royals: "kc", Twins: "min",
    Astros: "hou", Mariners: "sea", Angels: "laa", Rangers: "tex", Athletics: "oak",
    Braves: "atl", Mets: "nym", Phillies: "phi", Marlins: "mia", Nationals: "wsh",
    Cardinals: "stl", Brewers: "mil", Cubs: "chc", Pirates: "pit", Reds: "cin",
    Dodgers: "lad", Padres: "sd", Giants: "sf", Rockies: "col", "D-Backs": "ari"
  },
  football: {
    Patriots: "ne", Chiefs: "kc", Packers: "gb", Cowboys: "dal", Eagles: "phi",
    Giants: "nyg", Jets: "nyj", "49ers": "sf", Rams: "lar", Seahawks: "sea",
    Ravens: "bal", Bears: "chi", Steelers: "pit", Saints: "no", Vikings: "min",
    Lions: "det", Dolphins: "mia", Bills: "buf", Texans: "hou", Titans: "ten",
    Chargers: "lac", Colts: "ind", Bengals: "cin", Broncos: "den", Panthers: "car",
    Jaguars: "jax", Raiders: "lv", Commanders: "wsh", Browns: "cle", Buccaneers: "tb",
    Cardinals: "ari"
  },
  college: {
    // ACC
    "Boston College": "103", California: "25", Clemson: "228", Duke: "150",
    "Florida State": "52", "Georgia Tech": "59", Louisville: "97", Miami: "2390",
    "NC State": "152", "North Carolina": "153", Pittsburgh: "221", SMU: "2567", Stanford: "24",
    Syracuse: "183", Virginia: "258", "Virginia Tech": "259", "Wake Forest": "154",
    // Big Ten
    Illinois: "356", Indiana: "84", Iowa: "2294", Maryland: "120", Michigan: "130",
    "Michigan State": "127", Minnesota: "135", Nebraska: "158", Northwestern: "77",
    "Ohio State": "194", Oregon: "2483", "Penn State": "213", Purdue: "2509", Rutgers: "164",
    UCLA: "26", USC: "30", Washington: "264", Wisconsin: "275",
    // Big 12
    Arizona: "12", "Arizona State": "9", BYU: "252", Baylor: "239", Cincinnati: "2132",
    Colorado: "38", Houston: "248", "Iowa State": "66", Kansas: "2305", "Kansas State": "2306",
    "Oklahoma State": "197", TCU: "2628", "Texas Tech": "2641", UCF: "2116", Utah: "254",
    "West Virginia": "277",
    // SEC
    Alabama: "333", Arkansas: "8", Auburn: "2", Florida: "57", Georgia: "61", Kentucky: "96",
    LSU: "99", "Mississippi State": "344", Missouri: "142", Oklahoma: "201", "Ole Miss": "145",
    "South Carolina": "2579", Tennessee: "2633", Texas: "251", "Texas A&M": "245",
    Vanderbilt: "238"
  }
};

const LOGO_URLS = {
  baseball: "https://a.espncdn.com/combiner/i?img=/i/teamlogos/mlb/500/{code}.png",
  football: "https://a.espncdn.com/combiner/i?img=/i/teamlogos/nfl/500/{code}.png",
  college: "https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500/{code}.png"
};

let currentSport = localStorage.getItem('bingo_sport') || 'baseball';

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateBoard(sport) {
  const teams = Object.keys(TEAMS[sport]);
  const selected = shuffle(teams).slice(0, 24);

  const board = [];
  let idx = 0;

  for (let row = 0; row < 5; row++) {
    const rowData = [];
    for (let col = 0; col < 5; col++) {
      if (row === 2 && col === 2) {
        rowData.push({ name: "FREE", is_free: true });
      } else {
        rowData.push({ name: selected[idx], is_free: false });
        idx++;
      }
    }
    board.push(rowData);
  }

  return board;
}

function saveBoard(sport, board, marks) {
  localStorage.setItem(`bingo_board_${sport}`, JSON.stringify(board));
  localStorage.setItem(`bingo_marks_${sport}`, JSON.stringify(marks));
}

function loadBoard(sport) {
  const boardData = localStorage.getItem(`bingo_board_${sport}`);
  const marksData = localStorage.getItem(`bingo_marks_${sport}`);

  if (boardData && marksData) {
    return {
      board: JSON.parse(boardData),
      marks: new Set(JSON.parse(marksData))
    };
  }

  const board = generateBoard(sport);
  const marks = new Set(['2-2']);
  saveBoard(sport, board, Array.from(marks));

  return { board, marks };
}

function renderBoard(board, marks) {
  const table = document.getElementById('bingo');
  table.innerHTML = '';

  board.forEach((row, rowIdx) => {
    const tr = document.createElement('tr');

    row.forEach((cell, colIdx) => {
      const td = document.createElement('td');
      const key = `${rowIdx}-${colIdx}`;

      if (marks.has(key) || cell.is_free) {
        td.classList.add('marked');
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'cell';

      if (cell.is_free) {
        td.dataset.free = 'true';
        wrapper.textContent = 'FREE';
      } else {
        const code = TEAMS[currentSport][cell.name];
        const imgUrl = LOGO_URLS[currentSport].replace('{code}', code);

        const img = document.createElement('img');
        img.src = imgUrl;
        img.alt = cell.name;

        const div = document.createElement('div');
        div.textContent = cell.name;

        wrapper.appendChild(img);
        wrapper.appendChild(div);

        td.onclick = () => toggleMark(td, rowIdx, colIdx);
      }

      td.appendChild(wrapper);

      tr.appendChild(td);
    });

    table.appendChild(tr);
  });
}

function toggleMark(cell, row, col) {
  if (cell.dataset.free === 'true') return;

  const key = `${row}-${col}`;
  const marksData = localStorage.getItem(`bingo_marks_${currentSport}`);
  const marks = new Set(JSON.parse(marksData));

  if (marks.has(key)) {
    marks.delete(key);
    cell.classList.remove('marked');
  } else {
    marks.add(key);
    cell.classList.add('marked');
  }

  localStorage.setItem(`bingo_marks_${currentSport}`, JSON.stringify(Array.from(marks)));

  checkBingo();
}

function checkBingo() {
  const table = document.getElementById('bingo');
  const rows = Array.from(table.rows);

  const isMarked = (r, c) =>
    rows[r] && rows[r].cells[c] && rows[r].cells[c].classList.contains('marked');

  const bingo = () => {
    for (let i = 0; i < 5; i++) {
      if ([0, 1, 2, 3, 4].every(j => isMarked(i, j))) return true;
      if ([0, 1, 2, 3, 4].every(j => isMarked(j, i))) return true;
    }
    if ([0, 1, 2, 3, 4].every(i => isMarked(i, i))) return true;
    if ([0, 1, 2, 3, 4].every(i => isMarked(i, 4 - i))) return true;
    return false;
  };

  if (bingo()) {
    confetti({
      particleCount: 150,
      spread: 70,
      origin: { y: 0.6 }
    });
  }
}

function generateNewCard() {
  const confirmed = confirm('Generate a new card? Your current board and marks will be lost.');
  if (!confirmed) {
    return;
  }

  const board = generateBoard(currentSport);
  const marks = new Set(['2-2']);
  saveBoard(currentSport, board, Array.from(marks));
  renderBoard(board, marks);
}

function changeSport(sport) {
  currentSport = sport;
  localStorage.setItem('bingo_sport', sport);

  const sportTitle = sport.charAt(0).toUpperCase() + sport.slice(1) + ' Bingo';
  document.getElementById('title').textContent = sportTitle;
  document.title = sportTitle;

  const { board, marks } = loadBoard(sport);
  renderBoard(board, marks);
}

document.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const sportParam = urlParams.get('sport');
  if (sportParam) {
    currentSport = sportParam;
    localStorage.setItem('bingo_sport', sportParam);
  }

  const sportTitle = currentSport.charAt(0).toUpperCase() + currentSport.slice(1) + ' Bingo';
  document.getElementById('title').textContent = sportTitle;
  document.title = sportTitle;

  const { board, marks } = loadBoard(currentSport);
  renderBoard(board, marks);
});
</script>
</body>
</html>
